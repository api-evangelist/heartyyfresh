description: HeartyyFresh is a mobile-first Indian grocery delivery service that lets customers
  order fresh Indian groceries and household staples for home delivery through its iOS and Android
  apps. The consumer offering centers on convenience and quality, promoting a first-time incentive of
  20% off the first five orders placed through the app. HeartyyFresh operates as a direct-to-consumer
  grocery app (published under the com.rahein.heartyyfresh Android package and the "HeartyyFresh -
  Indian Grocery" iOS listing) rather than a developer platform; it exposes no public API, developer
  portal, documentation, or SDKs at this time. This profile was surfaced as a portfolio-lead stub and
  enriched for identity only.
